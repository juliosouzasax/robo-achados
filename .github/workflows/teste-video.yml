name: teste-video
on:
  push:
    paths: ["testes/video.txt"]
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node testes/video.js
