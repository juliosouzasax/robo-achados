name: transcrever
on:
  push:
    paths: ["tmp/a.mp3"]
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q faster-whisper
      - run: |
          python - <<'P'
          from faster_whisper import WhisperModel
          m = WhisperModel("medium", device="cpu", compute_type="int8")
          segs, _ = m.transcribe("tmp/a.mp3", language="pt", word_timestamps=True)
          for s in segs:
              print("SEG", f"{s.start:.2f}-{s.end:.2f}", s.text)
              print("WORDS", " ".join(f"{w.word.strip()}@{w.start:.2f}-{w.end:.2f}" for w in s.words))
          P
